# Reusable middlewares. Reference them from Docker labels as <name>@file.
# cloudflare-only, secure-headers and compress are applied to EVERY websecure router (see traefik.yml);
# rate-limit is opt-in per app.

http:
  middlewares:

    secure-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        # No stsPreload: the preload token lets anyone submit the domain to the browsers' built-in
        # HSTS list, which forces HTTPS on EVERY subdomain and takes months to undo.
        contentTypeNosniff: true
        referrerPolicy: strict-origin-when-cross-origin
        customFrameOptionsValue: SAMEORIGIN   # change per app if it must be embedded elsewhere
        customResponseHeaders:
          Server: ""                          # don't advertise the stack
          X-Powered-By: ""

    compress:
      compress:
        minResponseBodyBytes: 1024

    # Reject requests that bypass Cloudflare and hit the origin IP directly (curl -k -H 'Host: ...').
    # Applied on the websecure entrypoint, so every host you route MUST be proxied (orange cloud)
    # in Cloudflare DNS. Checks the TCP peer address, not headers, so it cannot be spoofed.
    # Ranges: https://www.cloudflare.com/ips/
    cloudflare-only:
      ipAllowList:
        sourceRange:
          - 100.64.0.0/10         # Tailscale — lets you hit apps directly over the tailnet
          - 173.245.48.0/20
          - 103.21.244.0/22
          - 103.22.200.0/22
          - 103.31.4.0/22
          - 141.101.64.0/18
          - 108.162.192.0/18
          - 190.93.240.0/20
          - 188.114.96.0/20
          - 197.234.240.0/22
          - 198.41.128.0/17
          - 162.158.0.0/15
          - 104.16.0.0/13
          - 104.24.0.0/14
          - 172.64.0.0/13
          - 131.0.72.0/22
          - 2400:cb00::/32
          - 2606:4700::/32
          - 2803:f800::/32
          - 2405:b500::/32
          - 2405:8100::/32
          - 2a06:98c0::/29
          - 2c0f:f248::/32

    # Opt-in: simple per-IP rate limit for login/API endpoints.
    #   traefik.http.routers.myapp.middlewares: rate-limit@file
    # Safe to key on CF-Connecting-IP because cloudflare-only guarantees the request came via Cloudflare.
    rate-limit:
      rateLimit:
        average: 50
        burst: 100
        period: 1s
        sourceCriterion:
          requestHeaderName: CF-Connecting-IP   # real visitor IP behind Cloudflare

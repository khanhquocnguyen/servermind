# Traefik static configuration (read once at startup; restart the container after editing).
# Dynamic config (TLS certs, middlewares) lives in ./dynamic and is hot-reloaded.

global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO
  format: json

accessLog:
  format: json
  bufferingSize: 100
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop
      names:
        User-Agent: keep
        CF-Connecting-IP: keep   # real client IP as seen by Cloudflare
        CF-Ray: keep             # handy when debugging with Cloudflare support

ping: {}   # answers on the internal :8080 for the compose healthcheck; that port is not published

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"
    # How Traefik handles the X-Forwarded-For / X-Real-IP headers on an incoming request:
    #   connection from an IP in trustedIPs  -> KEEP the headers (they hold the real visitor IP)
    #   connection from any other IP         -> DELETE them and REWRITE with the connecting IP
    # This is NOT an allow/deny list; it only decides what IP the apps behind Traefik get told.
    # Ranges: https://www.cloudflare.com/ips/
    forwardedHeaders:
      trustedIPs:
        - 173.245.48.0/20
        - 103.21.244.0/22
        - 103.22.200.0/22
        - 103.31.4.0/22
        - 141.101.64.0/18
        - 108.162.192.0/18
        - 190.93.240.0/20
        - 188.114.96.0/20
        - 197.234.240.0/22
        - 198.41.128.0/17
        - 162.158.0.0/15
        - 104.16.0.0/13
        - 104.24.0.0/14
        - 172.64.0.0/13
        - 131.0.72.0/22
        - 2400:cb00::/32
        - 2606:4700::/32
        - 2803:f800::/32
        - 2405:b500::/32
        - 2405:8100::/32
        - 2a06:98c0::/29
        - 2c0f:f248::/32
    http:
      tls: {}   # every router on this entrypoint gets TLS; cert comes from dynamic/tls.yml
      middlewares:
        # Applied to EVERY router on websecure, in this order:
        - cloudflare-only@file   # 403 unless the TCP peer is Cloudflare (or Tailscale). Makes
                                 # CF-Connecting-IP trustworthy, so rate-limit cannot be spoofed.
        - secure-headers@file
        - compress@file

providers:
  docker:
    endpoint: "tcp://socket-proxy:2375"   # read-only gate, see docker-compose.yml
    exposedByDefault: false          # a container is routed only if it has traefik.enable=true
    network: traefik-proxy-network   # always talk to containers over this network
  file:
    directory: /etc/traefik/dynamic
    watch: true
